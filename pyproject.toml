[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "digits-model-arena"
version = "1.0.0"
description = "A reproducible, leakage-safe comparison of compact classifiers on scikit-learn's handwritten digits benchmark."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Krrish Sharma" }]
dependencies = [
  "numpy>=1.24,<3",
  "scikit-learn>=1.4,<2",
  "joblib>=1.3,<2",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8,<4"]
test = ["pytest>=8,<9"]

[project.scripts]
digits-arena = "digits_arena.benchmark:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.hatch.build.targets.wheel]
packages = ["src/digits_arena"]
